name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra llm
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: Evaluate investigation behavior
        run: uv run labsre-evaluate > evaluation-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investigation-evaluation
          path: evaluation-results.json
      - name: Build package
        run: uv build
      - name: Build OCI image
        run: docker build --tag labsre:ci .
      - name: Exercise disposable homelab through MCP
        run: |
          trap 'docker compose -f compose.dummy.yaml logs --no-color; docker compose -f compose.dummy.yaml down --volumes' EXIT
          docker compose -f compose.dummy.yaml up --build --detach --wait
          curl --fail --retry 10 --retry-delay 1 --retry-all-errors \
            --header 'Content-Type: application/json' \
            --data '{"scenario_id":"dummy","objective":"Investigate why paperless_web is unavailable"}' \
            http://127.0.0.1:8010/incidents/investigate \
            --output /tmp/labsre-dummy-result.json
          python - <<'PY'
          import json
          with open('/tmp/labsre-dummy-result.json') as handle:
              result = json.load(handle)
          assert result['status'] == 'needs_human_investigation'
          assert result['recommendation']['action'] is None
          assert result['execution_result'] is None
          evidence = result['recommendation']['evidence']
          assert {s['project'] for s in evidence[0]['data']['services']} == {'dummy-homelab'}
          assert len(result['decision_trace']) > 1
          assert 0 < result['tool_calls'] <= 8
          logs = [e for e in evidence if e['source'] == 'get_service_logs']
          assert logs and '[REDACTED]' in json.dumps(logs)
          assert 'demo-token' not in json.dumps(result)
          PY
