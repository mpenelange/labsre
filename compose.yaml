services:
  api:
    build: .
    environment:
      LABSRE_SCENARIO_DIR: /app/scenarios
      LABSRE_MODE: replay
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  mcp:
    build: .
    command: ["labsre-mcp"]
    environment:
      LABSRE_SCENARIO_DIR: /app/scenarios
      LABSRE_MODE: replay
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    profiles: ["mcp-stdio"]

