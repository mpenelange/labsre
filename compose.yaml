services:
  api:
    build: .
    environment:
      LABSRE_SCENARIO_DIR: /app/scenarios
      LABSRE_MODE: replay
      LABSRE_MCP_URL: http://mcp:8001/mcp
      LABSRE_MODEL: ${LABSRE_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mcp

  mcp:
    build: .
    command: ["labsre-mcp"]
    environment:
      LABSRE_SCENARIO_DIR: /app/scenarios
      LABSRE_MODE: replay
      LABSRE_MCP_HOST: 0.0.0.0
      LABSRE_MCP_PORT: 8001
      LABSRE_MCP_TRANSPORT: streamable-http
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
